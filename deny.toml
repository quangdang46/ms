# cargo-deny configuration
# See https://embarkstudios.github.io/cargo-deny/

[graph]
# Targets to check against
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
# The path where the advisory database is cloned/fetched into
db-path = "~/.cargo/advisory-db"
# Use the RustSec advisory database
db-urls = ["https://github.com/rustsec/advisory-db"]
# Check for yanked crates
yanked = "warn"
# Ignore specific advisories (keep this list minimal!)
# yaml-rust is unmaintained but is pulled in transitively via syntect -> rich_rust
# No upgrade path available until syntect migrates to yaml-rust2
# gix-date non-utf8 string issue — requires vergen-gix 9.x (major version bump)
# atty unmaintained / potential unaligned read — pulled in transitively, no upgrade path
# bincode unmaintained — transitive dep with no drop-in replacement yet
ignore = [
    "RUSTSEC-2024-0320",
    "RUSTSEC-2025-0140",
    "RUSTSEC-2021-0145",
    "RUSTSEC-2024-0375",
    "RUSTSEC-2025-0141",
]

[licenses]
# Allow these licenses
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
]
# Confidence threshold for detecting license from file contents
confidence-threshold = 0.8

[bans]
# Deny multiple versions of the same crate
multiple-versions = "warn"
# Skip checking these crates for duplicates
skip = []
# Skip tree checking for workspace crates
wildcards = "allow"
# Highlight exact duplicates
highlight = "all"
# Deny specific crates
deny = [
    # Crates with known security issues or that are unmaintained
]

# Build-script checking is opt-in via [bans.build]. We intentionally leave the
# section unconfigured so that cargo-deny does not flag every crate that ships a
# build.rs — this project relies on many such crates (rustix, serde, ring, etc.).
# Re-enable here if/when we want to audit build scripts explicitly.

[sources]
# Allow crates from these sources
unknown-registry = "deny"
unknown-git = "deny"
# Allow crates.io as a source
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Allow these git repositories. `tru` (toon_rust) is consumed via git because the
# crate is not published to crates.io. Pin reviews on each tag/commit bump.
allow-git = ["https://github.com/Dicklesworthstone/toon_rust"]

[sources.allow-org]
# Allow crates from these GitHub orgs
github = []
